        <div class="progress-bar" aria-label="Quiz Progress">
            <span class="progress-bar-fill" style="width:80%"></span>
        </div>
        <h2><span class="icon" aria-hidden="true">&#128161;</span> Question 4</h2>
        <div class="welcome-message">
            <p class="question">What does 'NEFT' stand for in banking?</p>
        </div>
        <div class="question-block">
            <label class="incorrect"><input type="radio" name="q4"> National Electronic Fund Transfer</label><br>
            <label class="correct"><input type="radio" name="q4"> National Electronic Funds Transfer
                <span class="explanation">Correct! NEFT stands for National Electronic Funds Transfer.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q4"> National Exchange Fund Transfer</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div class="question-block">
            <p class="question">Which of the following is a scheduled commercial bank in India?</p>
            <label class="correct"><input type="radio" name="q4b"> HDFC Bank
                <span class="explanation">Correct! HDFC Bank is a scheduled commercial bank in India.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q4b"> NABARD</label><br>
            <label class="incorrect"><input type="radio" name="q4b"> SIDBI</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div class="question-block">
            <p class="question">What is the main function of a bank's savings account?</p>
            <label class="correct"><input type="radio" name="q4c"> To encourage saving habits among people
                <span class="explanation">Correct! Savings accounts encourage saving habits and provide interest.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q4c"> To provide loans</label><br>
            <label class="incorrect"><input type="radio" name="q4c"> To issue credit cards</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div class="question-block">
            <p class="question">Which of the following is a central bank?</p>
            <label class="correct"><input type="radio" name="q4d"> Reserve Bank of India
                <span class="explanation">Correct! The Reserve Bank of India is the central bank of India.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q4d"> ICICI Bank</label><br>
            <label class="incorrect"><input type="radio" name="q4d"> Axis Bank</label>
        </div>
