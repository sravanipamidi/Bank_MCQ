<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Quiz</title>
        <link rel="stylesheet" href="style.css">
        <style>
        :root {
            --bg: #fff;
            --fg: #222;
            --container-bg: #f8faff;
        }
        [data-theme="dark"] {
            --bg: #181c1f;
            --fg: #f1f1f1;
            --container-bg: #23272a;
        }
        body {
            background: var(--bg) !important;
            color: var(--fg) !important;
        }
        .container, .home-container, .instructions-box {
            background: var(--container-bg) !important;
            color: var(--fg) !important;
        }
        .navbar-fixed {
            background: var(--container-bg) !important;
        }
        .btn-primary, .submit-btn {
            color: var(--fg) !important;
        }
        </style>
</head>
<body>
        <input type="checkbox" id="theme-toggle" style="display:none">
        <label for="theme-toggle" style="position:fixed;top:16px;right:16px;z-index:1000;cursor:pointer;user-select:none;background:#3498db;color:#fff;padding:8px 16px;border-radius:20px;font-size:1em;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <span class="light-label">🌞</span>
            <span class="dark-label" style="display:none;">🌙</span>
            Dark Mode
        </label>
        <script>
            const toggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            toggle.addEventListener('change', function() {
                if (toggle.checked) {
                    html.setAttribute('data-theme', 'dark');
                    document.querySelector('.light-label').style.display = 'none';
                    document.querySelector('.dark-label').style.display = '';
                } else {
                    html.removeAttribute('data-theme');
                    document.querySelector('.light-label').style.display = '';
                    document.querySelector('.dark-label').style.display = 'none';
                }
            });
        </script>
        <!-- No sidebar or instructions on this page -->
    <div class="container" style="border:2px solid #3498db; border-radius:16px; box-shadow:0 4px 16px rgba(52,152,219,0.10);">

        <div class="progress-bar" aria-label="Quiz Progress">
            <span class="progress-bar-fill" style="width:33%"></span>
        </div>
        <h2><span class="icon" aria-hidden="true">&#128161;</span> </h2>
        <div class="question-block">
            <p class="question"><strong>1.</strong> What does ATM stand for?</p>
            <label class="correct"><input type="radio" name="q1"> Automated Teller Machine
                <span class="explanation">Correct! ATM stands for Automated Teller Machine, a device that allows bank customers to perform financial transactions.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q1"> Automatic Transaction Machine</label><br>
            <label class="incorrect"><input type="radio" name="q1"> Account Transfer Mechanism</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div class="question-block">
            <p class="question"><strong>2.</strong> Which is a function of the Reserve Bank of India (RBI)?</p>
            <label class="correct"><input type="radio" name="q1b"> Issuing currency notes
                <span class="explanation">Correct! The RBI is responsible for issuing currency notes in India.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q1b"> Providing insurance to depositors</label><br>
            <label class="incorrect"><input type="radio" name="q1b"> Granting loans to the public</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div class="question-block">
            <p class="question"><strong>3.</strong> What is the full form of IFSC?</p>
            <label class="correct"><input type="radio" name="q1c"> Indian Financial System Code
                <span class="explanation">Correct! IFSC stands for Indian Financial System Code, used for electronic payment applications.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q1c"> International Fund Settlement Code</label><br>
            <label class="incorrect"><input type="radio" name="q1c"> Indian Fund Security Code</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div class="question-block">
            <p class="question"><strong>4.</strong> Which of the following is a negotiable instrument?</p>
            <label class="correct"><input type="radio" name="q1d"> Cheque
                <span class="explanation">Correct! A cheque is a negotiable instrument.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q1d"> Fixed Deposit Receipt</label><br>
            <label class="incorrect"><input type="radio" name="q1d"> Savings Account Passbook</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div style="flex:1 0 auto;"></div>
    </div>
    <nav class="navbar-fixed" style="margin-top: 32px;">
        <a href="index.html"><span class="nav-icon" aria-hidden="true">🏠</span></a>
        <a href="question1.html" class="active"><span class="nav-icon" aria-hidden="true">1️⃣</span></a>
        <a href="question2.html"><span class="nav-icon" aria-hidden="true">2️⃣</span></a>
        <a href="question3.html"><span class="nav-icon" aria-hidden="true">3️⃣</span></a>
        <a href="question4.html"><span class="nav-icon" aria-hidden="true">4️⃣</span></a>
        <a href="question5.html"><span class="nav-icon" aria-hidden="true">5️⃣</span></a>
    </nav>
    </div>
</body>
</html>
