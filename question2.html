        <div class="progress-bar" aria-label="Quiz Progress">
            <span class="progress-bar-fill" style="width:66%"></span>
        </div>
        <h2><span class="icon" aria-hidden="true">&#128161;</span> Question 2</h2>
        <div class="welcome-message">
            <p class="question">Which of the following is a type of bank account?</p>
        </div>
        <div class="question-block">
                        <label class="correct"><input type="radio" name="q2"> Savings Account
                            <span class="explanation">Correct! A Savings Account is a common type of bank account for saving money.</span>
                        </label><br>
                        <label class="incorrect"><input type="radio" name="q2"> Credit Account</label><br>
                        <label class="incorrect"><input type="radio" name="q2"> Investment Account</label>
</div>
<hr class="divider" aria-hidden="true">
<div class="question-block">
    <p class="question">Which of the following is a liability for a bank?</p>
    <label class="correct"><input type="radio" name="q2b"> Deposits of customers
        <span class="explanation">Correct! Deposits are liabilities for banks as they are owed to customers.</span>
    </label><br>
    <label class="incorrect"><input type="radio" name="q2b"> Loans given to customers</label><br>
    <label class="incorrect"><input type="radio" name="q2b"> Investments in government bonds</label>
</div>
<hr class="divider" aria-hidden="true">
<div class="question-block">
    <p class="question">What does KYC stand for?</p>
    <label class="correct"><input type="radio" name="q2c"> Know Your Customer
        <span class="explanation">Correct! KYC stands for Know Your Customer, a process for verifying the identity of clients.</span>
    </label><br>
    <label class="incorrect"><input type="radio" name="q2c"> Know Your Credit</label><br>
    <label class="incorrect"><input type="radio" name="q2c"> Keep Your Cash</label>
</div>
<hr class="divider" aria-hidden="true">
<div class="question-block">
    <p class="question">Which bank is known as the 'Banker to the Government' in India?</p>
    <label class="correct"><input type="radio" name="q2d"> Reserve Bank of India
        <span class="explanation">Correct! The Reserve Bank of India acts as the banker to the government.</span>
    </label><br>
    <label class="incorrect"><input type="radio" name="q2d"> State Bank of India</label><br>
    <label class="incorrect"><input type="radio" name="q2d"> Punjab National Bank</label>
</div>
