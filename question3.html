<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Quiz</title>
        <link rel="stylesheet" href="style.css">
        <style>
        :root {
            --bg: #fff;
            --fg: #222;
            --container-bg: #f8faff;
        }
        [data-theme="dark"] {
            --bg: #181c1f;
            --fg: #f1f1f1;
            --container-bg: #23272a;
        }
        body {
            background: var(--bg) !important;
            color: var(--fg) !important;
        }
        .container, .home-container, .instructions-box {
            background: var(--container-bg) !important;
            color: var(--fg) !important;
        }
        .navbar-fixed {
            background: var(--container-bg) !important;
        }
        .btn-primary, .submit-btn {
            color: var(--fg) !important;
        }
        </style>
</head>
<body>
        <input type="checkbox" id="theme-toggle" style="display:none">
        <label for="theme-toggle" style="position:fixed;top:16px;right:16px;z-index:1000;cursor:pointer;user-select:none;background:#3498db;color:#fff;padding:8px 16px;border-radius:20px;font-size:1em;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <span class="light-label">🌞</span>
            <span class="dark-label" style="display:none;">🌙</span>
            Dark Mode
        </label>
        <script>
            const toggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            toggle.addEventListener('change', function() {
                if (toggle.checked) {
                    html.setAttribute('data-theme', 'dark');
                    document.querySelector('.light-label').style.display = 'none';
                    document.querySelector('.dark-label').style.display = '';
                } else {
                    html.removeAttribute('data-theme');
                    document.querySelector('.light-label').style.display = '';
                    document.querySelector('.dark-label').style.display = 'none';
                }
            });
        </script>
    <div class="container" style="border:2px solid #3498db; border-radius:16px; box-shadow:0 4px 16px rgba(52,152,219,0.10);">

        <div class="progress-bar" aria-label="Quiz Progress">
            <span class="progress-bar-fill" style="width:100%"></span>
        </div>
        <h2><span class="icon" aria-hidden="true">&#128161;</span> </h2>
        <div class="question-block">
            <p class="question"><strong>9.</strong> What is the primary purpose of a credit score?</p>
            <label class="correct"><input type="radio" name="q3"> To determine loan eligibility
                <span class="explanation">Correct! Credit scores are primarily used by lenders to determine loan eligibility.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q3"> To calculate interest rates</label><br>
            <label class="incorrect"><input type="radio" name="q3"> To track spending habits</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div class="question-block">
            <p class="question"><strong>10.</strong> Which of the following is a direct tax?</p>
            <label class="correct"><input type="radio" name="q3b"> Income Tax
                <span class="explanation">Correct! Income Tax is a direct tax paid directly to the government.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q3b"> Goods and Services Tax</label><br>
            <label class="incorrect"><input type="radio" name="q3b"> Value Added Tax</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div class="question-block">
            <p class="question"><strong>11.</strong> What is the main purpose of a bank loan?</p>
            <label class="correct"><input type="radio" name="q3c"> To provide funds for personal or business needs
                <span class="explanation">Correct! Bank loans provide funds for various personal or business needs.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q3c"> To increase bank deposits</label><br>
            <label class="incorrect"><input type="radio" name="q3c"> To reduce inflation</label>
        </div>
        <hr class="divider" aria-hidden="true">
        <div class="question-block">
            <p class="question"><strong>12.</strong> Which of the following is a plastic money product?</p>
            <label class="correct"><input type="radio" name="q3d"> Debit Card
                <span class="explanation">Correct! Debit Card is a plastic money product.</span>
            </label><br>
            <label class="incorrect"><input type="radio" name="q3d"> Cheque</label><br>
            <label class="incorrect"><input type="radio" name="q3d"> Demand Draft</label>
        </div>
        </div>

    </nav>
    </div>
</body>
</html>
